apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'data-collector'
        static_configs:
          - targets: ['data-collector-service:8001']

      - job_name: 'notifier'
        static_configs:
          - targets: ['notifier-service:8002']