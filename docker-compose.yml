services:

 #Database utenti tramite PostgreSQL
  user-db:
    image: postgres:15-alpine
    container_name: user_db_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  #Database dei dati tramite MongoDB
  data-db:
    image: mongo:6.0
    container_name: data_db_container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  user-manager:
    build: ./user_manager
    container_name: user_manager_service
    expose: #le tengo segrete in modo tale che solo quella di NGNIX puo essere utilizzata
      - "5000"
      - "50051"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@user-db:5432/${POSTGRES_DB}
    depends_on:
      - user-db

  data-collector:
    build: ./data_collector
    container_name: data_collector_service
    expose: #le tengo segrete in modo tale che solo quella di NGNIX puo essere utilizzata
      - "5001"
      - "50052"
    environment:
      - MONGO_URL=mongodb://data-db:27017/
      - USER_MANAGER_GRPC=user-manager:50051
      - OPENSKY_CLIENT_ID=${OPENSKY_CLIENT_ID}
      - OPENSKY_CLIENT_SECRET=${OPENSKY_CLIENT_SECRET}
    depends_on:
      - data-db
      - user-manager

  nginx:
    image: nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx_gateway
    restart: always
    ports:
      - "80:80" #porta dove fa il server proxy
    depends_on:
      - user-manager
      - data-collector
    volumes:
      - ./nginx/configs/routing.conf:/etc/nginx/conf.d/routing.conf:ro

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafkabasic_kafka_1
    ports:
      - "29092:29092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafkabasic_kafka_1:29093

      # 9092 per i client interni al container; 29092 per l'host
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafkabasic_kafka_1:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
volumes:
  postgres_data:
  mongo_data:
  kafka-data: